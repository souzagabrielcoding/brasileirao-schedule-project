[project]
name = "brasileirao-schedule-project"
version = "0.1.0"
description = "Coleta e análise de dados do Campeonato Brasileiro e estimativa das distâncias percorridas pelos clubes."
readme = "README.md"
requires-python = ">=3.15.1"
dependencies = []

[project.scripts]
brasileirao-schedule-project = "brasileirao_schedule_project:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # Erros de estilo
    "F",   # Erros detectáveis pelo Pyflakes
    "I",   # Organização dos imports
    "UP",  # Modernização da sintaxe Python
    "B",   # Possíveis bugs
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
